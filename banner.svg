<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Banner do perfil de Kaiqui</title>
  <desc id="desc">Banner verde-limão com a marca KP, nome Kaiqui e apresentação como estudante de programação.</desc>
  <defs>
    <pattern id="contours" width="340" height="220" patternUnits="userSpaceOnUse">
      <path d="M-35 120C25 20 92 18 150 74s119 65 214-8" fill="none" stroke="#20251b" stroke-width="1.5" opacity=".09"/>
      <path d="M-42 151C22 48 93 46 148 99s124 63 225-12" fill="none" stroke="#20251b" stroke-width="1.5" opacity=".075"/>
      <path d="M-50 184C20 80 95 76 151 126s130 57 232-17" fill="none" stroke="#20251b" stroke-width="1.5" opacity=".06"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#20251b" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="#c7ff00"/>
  <rect width="1200" height="300" fill="url(#contours)"/>
  <g fill="#20251b">
    <text x="54" y="58" font-family="'DM Mono', Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.4">PORTFÓLIO ACADÊMICO • 2026</text>
    <text x="50" y="211" font-family="Impact, 'Arial Narrow', Arial, sans-serif" font-size="184" font-weight="900" letter-spacing="-7" filter="url(#softShadow)">KP/</text>
  </g>
  <line x1="470" y1="48" x2="470" y2="252" stroke="#20251b" stroke-width="1" opacity=".3"/>
  <g fill="#20251b">
    <text x="520" y="126" font-family="Impact, 'Arial Narrow', Arial, sans-serif" font-size="72" letter-spacing="-1.5">KAIQUI</text>
    <text x="522" y="161" font-family="'DM Mono', Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.8">ESTUDANTE • EM CONSTRUÇÃO CONTÍNUA</text>
    <text x="522" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="600">Aprendendo a construir ideias com código,</text>
    <text x="522" y="231" font-family="Arial, sans-serif" font-size="17" font-weight="600">um commit de cada vez.</text>
  </g>
  <g transform="translate(1048 48)">
    <rect width="102" height="36" rx="18" fill="#20251b"/>
    <circle cx="20" cy="18" r="5" fill="#c7ff00"/>
    <text x="34" y="23" font-family="'DM Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#f5f4ed">ONLINE</text>
  </g>
  <text x="1048" y="252" font-family="'DM Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#20251b">@KAILUTZ ↗</text>
</svg>
